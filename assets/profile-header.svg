<g font-family="Arial, sans-serif"><text x="52" y="63" fill="#f7bad5" font-size="17">Hey, I'm Awan Smith.</text><text x="48" y="143" fill="#f2f1f7" font-size="58" font-weight="600">Curiosity,</text><text x="48" y="211" fill="#f2f1f7" font-size="58" font-weight="600">written in <tspan fill="#f7bad5">code.</tspan></text><text x="52" y="278" fill="#bcc0d5" font-size="16">Web3 · Artificial intelligence · Open source</text><text x="52" y="310" fill="#bcc0d5" font-size="12">Based in China. Building and learning in public.</text></g></svg>